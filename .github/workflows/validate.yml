name: Validate translations

on:
  push:
    paths:
      - "translations_ar.json"
      - "tools/validate_translations.py"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate translations_ar.json
        run: python tools/validate_translations.py translations_ar.json
